<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Indie+Flower&family=Press+Start+2P&family=Shadows+Into+Light+Two&display=swap" rel="stylesheet">    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <section class="menu-bar">
            <section class="website-name">
                <h2>Mauve focus</h2>
            </section>
            <section class="info">
                <p>day</p>
                <p>month</p>
                <p>date</p>
                <p>time AM/PM</p>
            </section>
        </section>
    </header>
    <main>
        <section class="welcome">
            <h3>Welcome Aaysha...</h3>
        </section>
        <section class="tasks">
            <div class="header">
                <h3>Tasks</h3>
                <button id="add-task" type="button">+Task</button>
            </div>
            <section class="task-filter">
                <button type="button">Today</button>
                <button type="button">All Tasks</button>
            </section>
            <form id="task-form" hidden>
                <label for="task-name">Task:</label>
                <input type="text" id="task-name" required>
                <br>
                <label for="task-date">Date:</label>
                <input type="date" id="task-date" required>
                <br>
                <label for="task-time">Time:</label>
                <input type="time" id="task-time">
                <br>
                <button type="submit">Add Task</button>
            </form>
            <section id="task-list">
            </section>
                
        </section>
            
        <section class="study-time">
            <h2>Today's Study Time</h2>
            <section class="study-time-display">
                <section class="hour-time-box">
                    <span class="time-value">0</span>
                    <span class="time-label">HRS</span>
                </section>
                <span class="time-separator">:</span>
                <section class="min-time-box">
                    <span class="time-value">0</span>
                    <span class="time-label">MIN</span>
                </section>
            </section>
        </section>

        <section class="pomodoro" id="pomodoro">
            <section class="pomodoro-header">
                <h3>Pomodoro Timer</h3>
            </section>
            <section class="timer-mode">
                <button type="button" id="stopwatch-mode">Stopwatch</button>
                <button type="button" id="timer-mode">Timer</button>
            </section>
            <section class="timer-buttons">
                <button class="timer-button">25</button>
                <button class="timer-button">50</button>
                <button class="timer-button">60</button>
                <button class="timer-button">90</button>
                <button class="timer-button">120</button>
            </section>
            <section  class="custom-timer">
                <p>Custom:</p>
                <input type="number" class="timer-box" id="hours-input" min="0">
                <p>hrs</p>
                <input type="number" class="timer-box"  id="mins-input" min="0">
                <p>mins</p>
            </section>
            <span id="timer-display">00:00</span>
            <button id="start-focus" type="button">Start Focus</button>
            <section id="post-start">
            <button id="pause-focus" type="button">Pause Focus</button>
            <button id="resume-focus" type="button">Resume Focus</button>
            <button id="stop-focus" type="button">Stop Focus</button>
            </section>
        </section>

        <section class="contribution-calendar">
            <h2>Progress HeatMap</h2>
            <div class="heatmap-panel">
                <div class="heatmap-months"></div>
                <div class="heatmap-body">
                    <div class="heatmap-days">
                        <span>Sun</span>
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                    </div>
                    <div class="heatmap-grid"></div>
                </div>
            </div>
            <div class="heatmap-legend">
                <div class="legend-item"><span class="legend-box level-0"></span><span>0 min</span></div>
                <div class="legend-item"><span class="legend-box level-1"></span><span>up to 1 hr</span></div>
                <div class="legend-item"><span class="legend-box level-2"></span><span>1-3 hrs</span></div>
                <div class="legend-item"><span class="legend-box level-3"></span><span>3-4 hrs</span></div>
                <div class="legend-item"><span class="legend-box level-4"></span><span> 4 hrs</span></div>
            </div>
        </section>

        <section class="countdowns">
            <section class="day-counter">
                <section class="countdown-header">
                    <h2>Countdowns</h2>
                    <button id="addEvent" type="button">+ Event</button>
                </section>
                <section>
                    <form id="countdown-form" hidden>
                        <label for="event-name">Event:</label>
                        <input type="text" id="event-name" required>
                        <br>
                        <label for="event-date">Date:</label>
                        <input type="date" id="event-date" required>
                        <br>
                        <button type="submit">Add Countdown</button>
                    </form>
                    <section id="countdown-list">

                    </section>
                </section>

            </section>
            <section class="progress">
                <section class="progress-header">
                    <h3>Progress Counter</h3>
                    <button type="button" id="add-progress">+ Progress Counter</button>
                </section>
                <form id="progress-form" hidden>
                    <label for="progress-name">Name:</label>
                    <input type="text" id="progress-name" required>
                    <br>
                    <label for="starting-progress">Current:</label>
                    <input type="number" id="starting-progress" min="0">
                    <br>
                    <button type="submit">Add Counter</button>

                </form>
                <section class="progress-list">

                </section>
            </section>
        </section>

       <section class="projects">
            <section class="project-header">
                <h2>Projects</h2>
                <button id="add-project" type="button">+ Project</button>
            </section>
            <form id="project-form" hidden>
                <label for="project-name">Name:</label>
                <input type="text" id="project-name" required>
                <br>
                <label for="project-description">Description:</label>
                <input type="text" id="project-description" required>
                <br>
                <button type="submit">Add Project</button>
            </form>
            <section id="project-list"></section>
        </section>
    </main>
    <script src="./script.js"></script>
</body>

</html>
